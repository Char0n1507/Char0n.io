<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Advisory | Char0n.io</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <!-- MAIN APP CONTENT -->
  <div id="main-app-content">
    <div class="ambient-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <div id="app">
      <nav class="navbar">
        <a href="index.html" class="nav-logo-text">
          <span class="logo-name">char0n</span><span class="logo-dot">.io</span>
        </a>

        <!-- Desktop Nav -->
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#skills">Skills</a></li>
          <li><a href="index.html#certifications">Certifications</a></li>
          <li><a href="index.html#advisories">Advisories</a></li>

        </ul>
      </nav>

      <main style="padding-top: 120px; padding-bottom: 100px;">
        <div class="container">
            <a href="index.html#advisories" style="color: var(--accent-teal); font-family: var(--font-mono); margin-bottom: 2rem; display: inline-block;">&larr; Back to Portfolio</a>
            
            <div id="advisory-loading" style="color: var(--text-slate); font-family: var(--font-mono); font-size: 1.2rem; text-align: center; padding: 100px 0;">
                <i class="fas fa-spinner fa-spin" style="color: var(--accent-teal);"></i> Decrypting Advisory...
            </div>
            
            <div id="advisory-error" style="display: none; color: var(--accent-warning, #fbbf24); font-family: var(--font-mono); font-size: 1.2rem; text-align: center; padding: 100px 0; background: rgba(251, 191, 36, 0.05); border: 1px solid rgba(251, 191, 36, 0.2); border-radius: 12px;">
                <i class="fas fa-lock" id="error-icon" style="font-size: 2rem; margin-bottom: 15px; display: block;"></i> 
                <span id="error-title" style="font-weight: 600;">ACCESS DENIED</span><br><br>
                <span id="error-message" style="font-size: 1rem; color: var(--text-slate);">This content is currently unavailable.</span>
            </div>

            <!-- Markdown Render Container -->
            <div id="advisory-content" class="markdown-body" style="display: none;"></div>
        </div>
      </main>

      <footer>
        <div class="container">
          <div class="footer-links">
            <a href="https://github.com/Char0n1507" target="_blank" rel="noopener noreferrer"><i class="fab fa-github"></i></a>

            <a href="mailto:charanpedhiti1507@gmail.com"><i class="fas fa-envelope"></i></a>
          </div>
          <p class="mono-text" style="margin-top: 20px; font-size: 0.85rem;">Designed &amp; Built by Sri Charan Pedhiti</p>
        </div>
      </footer>
    </div>
  </div>

  <script type="module" src="./advisory.js"></script>
</body>
</html>
